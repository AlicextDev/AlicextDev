<svg viewBox="0 0 900 230" width="900" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #FFFFFF; letter-spacing: 1px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 27px; fill: #21171D; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15.5px; fill: #21171D; }
      .card-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #7A2E43; letter-spacing: 0.4px; }
      @keyframes pulseArrow {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(2.5px, -2.5px); }
      }
      @keyframes shimmerBar {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.88; }
      }
      .arrow-ne { animation: pulseArrow 2.4s ease-in-out infinite; }
      .bar-fill { animation: shimmerBar 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="230" rx="14" ry="14" fill="#F4DEE5" />

  <!-- Category Pill -->
  <rect x="28" y="24" width="64" height="22" rx="5" fill="#7A2E43" />
  <text x="60" y="39" text-anchor="middle" class="pill-text">DADOS</text>

  <!-- Top-Right External Link Arrow (↗) -->
  <g class="arrow-ne" stroke="#7A2E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="855" y1="43" x2="867" y2="31" />
    <polyline points="857,31 867,31 867,41" />
  </g>

  <!-- Card Title & Two-Line Description -->
  <text x="28" y="82" class="card-title">Análise de churn</text>
  <text x="28" y="111" class="card-desc">Diagnóstico de uma taxa de cancelamento de 56%, com as causas principais</text>
  <text x="28" y="134" class="card-desc">e um plano de ação para chegar a 18%.</text>

  <!-- Progress Track (Full Width 844px) -->
  <rect x="28" y="150" width="844" height="10" rx="5" fill="#E2B7C3" />

  <!-- Target Marker Line at 18% (x = 28 + 152 = 180) -->
  <circle cx="180" cy="155" r="3" fill="#F4DEE5" opacity="0.7" />

  <!-- Animated Wine Progress Bar (Starts at 56% = 472px, animates down to 18% = 152px, then loops) -->
  <rect x="28" y="150" width="472" height="10" rx="5" fill="#7A2E43" class="bar-fill">
    <animate attributeName="width" values="472;152;152;472" keyTimes="0;0.45;0.82;1" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1" />
  </rect>

  <!-- Metrics Labels Below Bar -->
  <text x="28" y="181" class="card-mono">hoje: 56%</text>
  <text x="872" y="181" text-anchor="end" class="card-mono">meta: 18%</text>

  <!-- Tech Footer -->
  <text x="28" y="211" class="card-mono">Python · Jupyter · dashboards</text>
</svg>