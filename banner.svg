<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="100%">
  <defs>
    <clipPath id="rounded-banner">
      <rect width="850" height="210" rx="14" ry="14" />
    </clipPath>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: 5.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 400;
        fill: #D9A5B3;
        letter-spacing: 0.5px;
      }
      .chart-line {
        fill: none;
        stroke: #21171D;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawLine 2.2s ease-out forwards;
      }
      .node {
        fill: #7A2E43;
        opacity: 0;
        animation: fadeInNode 0.5s ease-out forwards;
      }
      .node-1 { animation-delay: 0.9s; }
      .node-2 { animation-delay: 1.5s; }
      .node-3 { animation-delay: 2.0s; }
      .pulse-ring {
        fill: none;
        stroke: #7A2E43;
        stroke-width: 1.8;
        opacity: 0;
        transform-origin: 836px 53px;
        animation: pulse 2.4s infinite ease-out;
        animation-delay: 2.1s;
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeInNode {
        to { opacity: 1; }
      }
      @keyframes pulse {
        0% { transform: scale(0.5); opacity: 0.75; }
        100% { transform: scale(2.2); opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#rounded-banner)">
    <!-- Fundo escuro principal -->
    <rect width="850" height="210" fill="#21171D" />

    <!-- Bloco diagonal rosa à direita -->
    <polygon points="539,0 850,0 850,210 453,210" fill="#D9A5B3" />

    <!-- Textos principais -->
    <text x="50" y="102" class="title">ALICE XAVIER</text>
    <text x="52" y="142" class="subtitle">Software Engineering · Back-end · Dados</text>

    <!-- Linha do gráfico à direita -->
    <polyline class="chart-line" points="530,175 578,158 618,166 665,129 713,140 761,93 803,104 836,53" />

    <!-- Pontos de destaque no gráfico -->
    <circle cx="665" cy="129" r="5.5" class="node node-1" />
    <circle cx="761" cy="93" r="5.5" class="node node-2" />
    <circle cx="836" cy="53" r="6" class="node node-3" />
    <circle cx="836" cy="53" r="10" class="pulse-ring" />
  </g>
</svg>