<svg viewBox="0 0 410 190" width="410" height="190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 10px; fill: #FFFFFF; letter-spacing: 0.8px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 21px; fill: #21171D; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13.5px; fill: #21171D; }
      .card-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #7A2E43; }
      @keyframes pulseArrow {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(2px, -2px); }
      }
      .arrow-ne { animation: pulseArrow 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="410" height="190" rx="12" ry="12" fill="#F4DEE5" />
  <rect x="24" y="20" width="92" height="20" rx="5" fill="#7A2E43" />
  <text x="70.0" y="34" text-anchor="middle" class="pill-text">AUTOMAÇÃO</text>
  <g class="arrow-ne" stroke="#7A2E43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="372" y1="36" x2="383" y2="25" />
    <polyline points="374,25 383,25 383,34" />
  </g>
  <text x="24" y="68" class="card-title">Cadastro de produtos</text>
  <text x="24" y="95" class="card-desc">Cadastra milhares de produtos em um</text>
  <text x="24" y="115" class="card-desc">sistema corporativo automaticamente.</text>
  
  <text x="24" y="168" class="card-mono">Python · Pandas</text>
</svg>